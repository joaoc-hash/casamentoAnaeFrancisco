:root{
  color-scheme:light;
  --vinho:#4a1220; --vinho-escuro:#33091533; --bordeaux:#5e1a2c; --bordeaux-2:#6f2236;
  --marfim:#f8f3ec; --ouro:#b98e55; --ouro-claro:#dcbb85; --dahlia:#8e1b2e;
  --serif:'Cormorant Garamond',Georgia,serif; --script:'Pinyon Script','Snell Roundhand',cursive;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--marfim);color:var(--vinho);font-family:var(--serif);font-size:1.15rem;line-height:1.6}
body.lock{overflow:hidden;touch-action:none}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}

/* ---------- PALCO ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow:hidden;
  background:
   radial-gradient(ellipse at 50% 40%,#6a2236 0,transparent 65%),
   radial-gradient(circle at 10% 90%,#2a0812 0,transparent 50%),
   var(--vinho)}
.stage{--cw:min(78vw,calc(62svh*300/420),380px);position:relative;width:calc(var(--cw)*1.2);height:calc(var(--cw)*1.5);display:grid;place-items:center}
.stage>*{position:absolute;left:50%;top:50%}

/* envelope */
.env{width:calc(var(--cw)*1.2);height:calc(var(--cw)*.84);transform:translate(-50%,-50%);transition:transform 1.2s cubic-bezier(.45,.05,.25,1),opacity .4s ease;perspective:1200px}
.env>*{position:absolute;inset:0}
.back{background:var(--bordeaux);border-radius:10px;box-shadow:0 22px 50px #0006}
.pocket{border-radius:10px;background:linear-gradient(160deg,var(--bordeaux-2),var(--bordeaux));clip-path:polygon(0 0,50% 64%,100% 0,100% 100%,0 100%);z-index:3}
.flap{bottom:auto;height:64%;transform-origin:top;transform-style:preserve-3d;z-index:4}
.flap>div{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff{background:linear-gradient(180deg,#722840,var(--bordeaux-2))}
.fb{transform:rotateX(180deg);background:var(--bordeaux-2)}
.losango{inset:auto;left:0;width:100%;top:-64%;height:128%;z-index:5;clip-path:url(#losango);-webkit-clip-path:url(#losango);background:var(--aba) 50% 50%/cover no-repeat,#2a0d16;opacity:0;transition:opacity .7s ease .5s}
.open .losango{opacity:1}
.open .flap{transform:rotateX(180deg)}
.open .flap{z-index:1}
.env:not(.open) .flap{z-index:4}
.flap{transition:transform 1s cubic-bezier(.45,.05,.25,1),opacity .4s ease .8s}
.open .flap{opacity:0;transition:transform 1s cubic-bezier(.45,.05,.25,1),opacity .4s ease .8s,z-index 0s .5s}

/* selo de cera */
.seal{position:absolute;inset:auto;left:50%;top:50%;height:auto;padding:0;width:clamp(72px,27%,122px);aspect-ratio:400/459;touch-action:manipulation;transform:translate(-50%,-50%);z-index:6;border:0;background:var(--logo) center/contain no-repeat;cursor:pointer;font-size:0;color:transparent;filter:drop-shadow(0 3px 8px #0008);transition:opacity .5s ease,transform .6s ease;animation:pulse 2.4s ease-in-out infinite}
.seal:focus-visible{outline:3px solid #fff;outline-offset:4px}
.env.open{transform:translate(-50%,calc(-50% + var(--cw)*.3))}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.6);pointer-events:none;animation:none}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
.dica{position:absolute;top:calc(50% + var(--cw)*.62);left:50%;transform:translateX(-50%);margin:0;color:var(--ouro-claro);font-style:italic;font-size:1.05rem;white-space:nowrap;transition:opacity .4s}
.open~.dica{opacity:0}

/* cartão */
.cartao{overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#6a2236 0,transparent 70%),var(--vinho);padding:7.5rem 1rem}
.cw{--fs:clamp(150px,50vw,230px);position:relative;width:min(84vw,380px);margin:0 auto}
.card{position:relative;z-index:1;width:100%;aspect-ratio:300/420;margin:0;container-type:inline-size;opacity:0;transform:translateY(28px) scale(.96);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.card.vis{opacity:1;transform:none}
.flores{position:absolute;z-index:0;width:var(--fs);height:var(--fs);pointer-events:none;opacity:0;transition:opacity 1.4s ease .4s,transform 1.4s cubic-bezier(.2,.7,.2,1) .4s;background:var(--cluster) center/contain no-repeat}
.fl1{top:calc(var(--fs)*-.42);left:calc(var(--fs)*-.38);transform:translate(-12px,12px) scale(.94)}
.fl2{bottom:calc(var(--fs)*-.42);right:calc(var(--fs)*-.38);transform:rotate(180deg) translate(-12px,12px) scale(.94)}
.card.vis~.fl1{opacity:1;transform:none}
.card.vis~.fl2{opacity:1;transform:rotate(180deg)}
.fh{background:var(--cluster) center/contain no-repeat;position:absolute;z-index:0;width:clamp(130px,38vw,200px);aspect-ratio:1;pointer-events:none;opacity:.92}
.fh.a{left:-8%;bottom:-3%}
.fh.b{right:-8%;top:-3%;transform:rotate(180deg)}
.stage{z-index:1}
.card svg.forma{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 18px 30px #0007)}
.card .conteudo{position:absolute;inset:9.5% 10.5%;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--vinho)}
.conv{font-size:4.3cqw;line-height:1.3;font-style:italic;margin:0;text-wrap:balance}
.mono{width:13cqw;aspect-ratio:400/459;margin:1.5cqw 0 2cqw;background:var(--logo) center/contain no-repeat}
.foto{flex:1;width:100%;border-radius:50% 50% 3cqw 3cqw/38% 38% 3cqw 3cqw;border:1px solid var(--vinho);padding:1.6cqw;min-height:0}
.foto>div{width:100%;height:100%;border-radius:inherit;display:grid;place-items:center;background:var(--foto,linear-gradient(170deg,#e9d6cf,#c98d97 60%,#8e3a4e)) 50% 30%/cover no-repeat;color:#fff;font-style:italic;font-size:4.2cqw;padding:0 6cqw}
.data-c{font-size:4cqw;margin:2.5cqw 0 0;line-height:1.35}

/* ---------- SECÇÕES ---------- */
.avancar{position:absolute;bottom:calc(2.2rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--ouro-claro);font-style:italic;text-align:center;opacity:0;transition:opacity .6s .2s;text-decoration:none}
.avancar::after{content:"";display:block;width:1px;height:34px;margin:.5rem auto 0;background:var(--ouro-claro);animation:desce 1.8s ease-in-out infinite;transform-origin:top}
@keyframes desce{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.pronto .avancar{opacity:1}

section{padding:clamp(4rem,12vw,7rem) 1.5rem;text-align:center}
.sec-in{max-width:34rem;margin:0 auto}
h2{font:400 clamp(2.6rem,9vw,3.8rem)/1.1 var(--script);color:var(--dahlia);margin:0 0 1.4rem}
.dia{display:flex;justify-content:center;align-items:baseline;gap:1.1rem;margin:.5rem 0;flex-wrap:wrap}
.dia b{font:500 clamp(3.6rem,16vw,5.6rem)/1 var(--serif)}
.dia span{font-size:1.5rem;text-align:left;line-height:1.25;font-style:italic}
.hora{font-size:1.4rem;margin:1rem 0 0}
.fio{width:5.5rem;height:1px;background:var(--ouro);margin:2rem auto;border:0}
.cd{display:flex;justify-content:center;gap:clamp(1rem,5vw,2rem);margin-top:1.5rem}
.cd div{min-width:3.6rem}.cd strong{display:block;font:500 2.2rem/1 var(--serif)}.cd small{font-style:italic;font-size:1rem}

.escuro{background:var(--vinho);color:var(--marfim)}
.escuro h2{color:var(--ouro-claro)}
.local{font:500 clamp(1.9rem,7vw,2.6rem)/1.2 var(--serif);margin:.2rem 0 1.6rem}
.btn{display:inline-block;padding:.8rem 2rem;border:1px solid var(--ouro-claro);color:var(--ouro-claro);text-decoration:none;font-size:1.15rem;border-radius:999px 999px 14px 14px;transition:background .3s,color .3s}
.btn:hover,.btn:focus-visible{background:var(--ouro-claro);color:var(--vinho);outline:none}

footer{padding:4.5rem 1.5rem calc(4rem + env(safe-area-inset-bottom,0px));text-align:center}
.logo{display:block;width:min(70vw,13rem);aspect-ratio:400/459;margin:0 auto;background:var(--logo) center/contain no-repeat}
footer p{margin:1.4rem 0 0;font-style:italic}

@media (max-width:420px){body{font-size:1.08rem}section{padding:3.5rem 1.25rem}.cd{gap:.8rem}.cd div{min-width:3.2rem}.cd strong{font-size:1.9rem}.dica{font-size:1rem}.avancar{font-size:1rem}}
@media (max-height:560px) and (orientation:landscape){.stage{--cw:min(40vw,calc(78svh*300/420))}.dica{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body class="lock">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><clipPath id="losango" clipPathUnits="objectBoundingBox"><path d="M.45,.05Q.5,0 .55,.05L.95,.45Q1,.5 .95,.55L.55,.95Q.5,1 .45,.95L.05,.55Q0,.5 .05,.45Z"/></clipPath></svg>

<header class="hero" id="topo">
  
  
  <div class="stage">
    <div class="env" id="env">
      <div class="back"></div>
      <div class="losango"></div>
      <div class="pocket"></div>
      <div class="flap"><div class="ff"></div><div class="fb"></div></div>
      <button class="seal" id="selo" aria-label="Abrir o convite"></button>
    </div>
    <p class="dica">Toque no selo para abrir</p>

  </div>
  <a class="avancar" href="#convite">Desliza para ver os detalhes</a>
</header>

<section class="cartao" id="convite"><div class="cw">
  <article class="card" id="card">
      <svg class="forma" viewBox="0 0 300 420" preserveAspectRatio="none" aria-hidden="true">
        <path d="M60 8H240C250 8 258 16 262 26C266 36 276 42 286 42L292 44V376L286 378C276 378 266 384 262 394C258 404 250 412 240 412H60C50 412 42 404 38 394C34 384 24 378 14 378L8 376V44L14 42C24 42 34 36 38 26C42 16 50 8 60 8Z" fill="#fbf8f3" stroke="#5e1a2c" stroke-width="1.2"/>
        <path d="M62 16H238C246 16 252 22 256 31C260 41 270 48 280 49L284 50V370L280 371C270 372 260 379 256 389C252 398 246 404 238 404H62C54 404 48 398 44 389C40 379 30 372 20 371L16 370V50L20 49C30 48 40 41 44 31C48 22 54 16 62 16Z" fill="none" stroke="#b98e55" stroke-width=".6"/>
      </svg>
      <div class="conteudo">
        <p class="conv">O amor trouxe-nos até aqui.<br>Agora queremos celebrar convosco!</p>
        <div class="mono" role="img" aria-label="Logotipo A e F"></div>
        <div class="foto"><div id="foto" role="img" aria-label="Fotografia dos noivos"></div></div>
        <p class="data-c">10 de julho de 2027<br>Palácio de São Marcos</p>
      </div>
    </article>
  <div class="flores fl2" aria-hidden="true"></div></div>
</section>

<section id="data">
  <div class="sec-in">
    <h2>Save the date</h2>
    <div class="dia"><b>10</b><span>julho<br>2027</span></div>
    <p class="hora">Sábado, às 12:30</p>
    <div class="cd" id="cd" aria-label="Contagem decrescente"></div>
  </div>
</section>

<section class="escuro" id="local">
  <div class="sec-in">
    <h2>O local</h2>
    <p class="local">Palácio de São Marcos</p>
    <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Pal%C3%A1cio+de+S%C3%A3o+Marcos">Ver no mapa</a>
  </div>
</section>

<footer>
  <div class="logo" role="img" aria-label="Logotipo A e F"></div>
  <p>Será uma honra celebrar convosco.</p>
</footer>

<script>
(function(){
  // Para usar a vossa fotografia, cole aqui uma imagem em base64 (data:image/jpeg;base64,...)
  var FOTO='';
  var f=document.getElementById('foto');
  if(FOTO){f.style.setProperty('--foto','url('+FOTO+')');f.textContent='';}

  var env=document.getElementById('env'),btn=document.getElementById('selo'),done=false;
  function abrir(){
    if(done)return;done=true;
    env.classList.add('open');
    setTimeout(function(){document.body.classList.remove('lock');document.querySelector('.hero').classList.add('pronto');},1500);
  }
  btn.addEventListener('click',abrir);
  document.querySelector('.hero').addEventListener('click',abrir);

  var cardEl=document.querySelector('.card');
  if('IntersectionObserver' in window){new IntersectionObserver(function(e,o){if(e[0].isIntersecting){cardEl.classList.add('vis');o.disconnect();}},{threshold:.3}).observe(cardEl);}else{cardEl.classList.add('vis');}

  var alvo=new Date(2027,6,10,12,30,0),cd=document.getElementById('cd');
  function tick(){
    var d=alvo-new Date();if(d<0)d=0;
    var s=Math.floor(d/1000),v=[[Math.floor(s/86400),'dias'],[Math.floor(s%86400/3600),'horas'],[Math.floor(s%3600/60),'min'],[s%60,'seg']];
    cd.innerHTML=v.map(function(x){return '<div><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div>'}).join('');
  }
  tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
